<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="#07090e"/>
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#neonGradient)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Stylized Barbell / Lightning 'D' Emblem -->
  <g filter="url(#glow)">
    <!-- Dumbbell Left Plate -->
    <rect x="110" y="180" width="28" height="152" rx="8" fill="url(#neonGradient)"/>
    <rect x="144" y="206" width="18" height="100" rx="6" fill="url(#neonGradient)"/>
    
    <!-- Central Bar -->
    <rect x="162" y="244" width="188" height="24" rx="4" fill="#ffffff"/>
    
    <!-- Dumbbell Right Plate -->
    <rect x="350" y="206" width="18" height="100" rx="6" fill="url(#neonGradient)"/>
    <rect x="374" y="180" width="28" height="152" rx="8" fill="url(#neonGradient)"/>
    
    <!-- Stylized Lightning Bolt in Center -->
    <polygon points="275,130 220,260 258,260 237,382 305,240 265,240" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
